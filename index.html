<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judith's corner. ݁₊ ⊹ . ݁˖ .</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <!-- Main Central Container Box -->
    <main class="main-container">

        <!-- Top Header Row -->
        <header class="top-header-row">
            
            <!-- Left Side: Companion Pet + Name + Thought Bubble -->
            <div class="pet-thought-container">
                <div class="pet-badge-row">
                    <img src="assets/gifs/pet.gif" alt="Juno" class="pet-gif">
                    <span class="pet-name">Juno 💘</span>
                </div>
                
                <!-- Leafy-Green Thought Bubble -->
                <div class="thought-bubble">
                    <p>Tengo ganas de ser aire Y me respires para siempre</p>
                </div>
            </div>

            <!-- Right Side: Full Flush Horizontal Banner -->
            <div class="banner-container">
                <img src="assets/gifs/header-banner.gif" alt="Header Banner" class="header-banner-gif">
            </div>

        </header>

    </main>

    <script src="scripts/main.js"></script>
</body>
</html>
